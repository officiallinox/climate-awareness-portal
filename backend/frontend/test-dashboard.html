<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
</head>
<body>
    <h1>Testing Dashboard</h1>
    <iframe src="dashboard.html" width="100%" height="800" style="border: 1px solid #ccc;"></iframe>
    
    <script>
        // Test if dashboard loads without errors
        window.addEventListener('load', function() {
            setTimeout(() => {
                const iframe = document.querySelector('iframe');
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    console.log('✅ Dashboard loaded successfully');
                    console.log('Theme:', iframeDoc.documentElement.getAttribute('data-theme'));
                } catch (e) {
                    console.log('❌ Dashboard has cross-origin restrictions');
                }
            }, 2000);
        });
    </script>
</body>
</html>
